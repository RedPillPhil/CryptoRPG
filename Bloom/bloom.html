<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Token Info</title>
    <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
</head>
<body>
    <h1>Bloom Token Metrics</h1>
    <div id="metrics">
        <p>Loading...</p>
    </div>

    <script>
        // Check if Web3 is available (via MetaMask)
        if (window.ethereum) {
            var web3 = new Web3(window.ethereum); // Use the provider from MetaMask
            window.ethereum.enable().catch(console.error);
        } else {
            alert("Please install MetaMask to interact with the blockchain.");
        }

        const contractAddress = '0x4A67A65c2fdB0397fa41eFC3896b0eCD4c2d006E';
        const usdcAddress = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
        const pairAddress = '0x8cccbb96e0f8d491c611dd2Ab5f45753728A167a';
        const tokenDecimals = 6;

        // Contract ABI (simplified for required functions)
        const contractABI = [
            { "constant": true, "inputs": [], "name": "totalSupply", "outputs": [{ "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" },
            { "constant": true, "inputs": [], "name": "basePercent", "outputs": [{ "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" },
            { "constant": true, "inputs": [], "name": "upcomingRebasePercentage", "outputs": [{ "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" }
        ];

        // Create contract instance
        const contract = new web3.eth.Contract(contractABI, contractAddress);

        // Function to get metrics
        async function getMetrics() {
            const [totalSupply, basePercent, rebasePercent, tokenBalance, usdcBalance] = await Promise.all([
                contract.methods.totalSupply().call(),
                contract.methods.basePercent().call(),
                contract.methods.upcomingRebasePercentage().call(),
                new web3.eth.Contract([{
                    "constant": true,
                    "inputs": [{ "name": "_owner", "type": "address" }],
                    "name": "balanceOf",
                    "outputs": [{ "name": "balance", "type": "uint256" }],
                    "type": "function"
                }], contractAddress).methods.balanceOf(pairAddress).call(),
                new web3.eth.Contract([{
                    "constant": true,
                    "inputs": [{ "name": "_owner", "type": "address" }],
                    "name": "balanceOf",
                    "outputs": [{ "name": "balance", "type": "uint256" }],
                    "type": "function"
                }], usdcAddress).methods.balanceOf(pairAddress).call()
            ]);

            const price = usdcBalance / tokenBalance;
            const marketCap = (totalSupply / 10 ** tokenDecimals) * price;

            return {
                totalSupply: (totalSupply / 10 ** tokenDecimals).toLocaleString(),
                burnRate: (100 / basePercent).toFixed(2),
                bloomRate: rebasePercent,
                price: price.toFixed(6),
                marketCap: marketCap.toFixed(2)
            };
        }

        // Fetch and display metrics
        async function displayMetrics() {
            const metrics = await getMetrics();
            document.getElementById('metrics').innerHTML = `
                <p><strong>Total Supply:</strong> ${metrics.totalSupply}</p>
                <p><strong>Burn Rate:</strong> ${metrics.burnRate}%</p>
                <p><strong>Bloom Rate:</strong> ${metrics.bloomRate}%</p>
                <p><strong>Price:</strong> $${metrics.price}</p>
                <p><strong>Market Cap:</strong> $${metrics.marketCap}</p>
            `;
        }

        // Load metrics
        displayMetrics();
    </script>
</body>
</html>
