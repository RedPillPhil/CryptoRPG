  const bloom = new web3.eth.Contract(bloomAbi, bloomTokenAddress);
  const lp = new web3.eth.Contract(lpAbi, lpAddress);

  async function fetchStats() {
    try {
      const [supply, decimals, basePercent, creationTime] = await Promise.all([
        bloom.methods.totalSupply().call(),
        bloom.methods.decimals().call(),
        bloom.methods.basePercent().call(),
        bloom.methods.contractCreationTime().call()
      ]);

      const token0 = await lp.methods.token0().call();
      const reserves = await lp.methods.getReserves().call();

      const reserveBloom = token0.toLowerCase() === bloomTokenAddress.toLowerCase() ? reserves._reserve0 : reserves._reserve1;
      const reserveUSDC = token0.toLowerCase() === bloomTokenAddress.toLowerCase() ? reserves._reserve1 : reserves._reserve0;

      const price = reserveUSDC / reserveBloom;
      const totalSupplyFormatted = supply / (10 ** decimals);
      const marketCap = totalSupplyFormatted * price;
      const burnRate = 100 / basePercent;

      const now = Math.floor(Date.now() / 1000);
      const secondsSinceStart = now - creationTime;
      const secondsToNextRebase = 3600 - (secondsSinceStart % 3600);
      const countdown = new Date(secondsToNextRebase * 1000).toISOString().substr(11, 8);

      document.getElementById('totalSupply').innerText = totalSupplyFormatted.toFixed(2);
      document.getElementById('price').innerText = `$${price.toFixed(2)}`;
      document.getElementById('marketCap').innerText = marketCap.toFixed(2);
      document.getElementById('burnRate').innerText = burnRate.toFixed(2);
      document.getElementById('countdown').innerText = countdown;

      fetchUpcomingRebasePercentage();
    } catch (error) {
      console.error("Error fetching stats:", error);
    }
  }

  async function fetchUpcomingRebasePercentage() {
    try {
      const rate = await bloom.methods.upcomingRebasePercentage().call();
      document.getElementById("upcomingRebasePercentage").innerText = `${rate}%`;
    } catch (err) {
      console.error("Failed to fetch rebase %:", err);
      document.getElementById("upcomingRebasePercentage").innerText = "Error";
    }
  }

  async function connectWallet() {
    if (window.ethereum) {
      try {
        window.web3 = new Web3(window.ethereum);
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        const wallet = accounts[0];
        document.getElementById('walletAddress').innerText = `Wallet: ${wallet}`;
      } catch (err) {
        console.error("Wallet connection error:", err);
        document.getElementById('walletAddress').innerText = "Wallet: Error";
      }
    } else {
      alert("MetaMask not detected");
      document.getElementById('walletAddress').innerText = "Wallet: Not Detected";
    }
  }

  async function triggerRebase() {
    try {
      const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
      const account = accounts[0];
      const web3Injected = new Web3(window.ethereum);
      const bloomWrite = new web3Injected.eth.Contract(bloomAbi, bloomTokenAddress);
      await bloomWrite.methods.Bloom().send({ from: account });
      alert('Rebase triggered!');
      fetchStats();
    } catch (err) {
      alert('Rebase failed: ' + err.message);
    }
  }

  // Auto-connect wallet and fetch stats on page load

    await connectWallet();
    await fetchStats();
    setInterval(fetchStats, 15000); // Refresh every 15 seconds
