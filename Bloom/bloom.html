<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bloom</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.0.3/chroma.min.js"></script>
</head>
<body>

<!-- Flower generator visual (keep untouched) -->
<svg id="svg"></svg>

<!-- Header -->
<header>
  <h1>Bloom</h1>
  <nav>
    <a href="#">Portal</a>
    <a href="#">About</a>
    <a href="#">Tokenomics</a>
    <a href="#">Swap</a>
  </nav>
</header>

<!-- Bloom Token Stats -->
<section>
  <ul id="bloom-stats" style="list-style: none; padding: 1em; font-family: Montserrat;">
    <li id="price">Price: Loading...</li>
    <li id="upcomingRebasePercentage">Rebase: Loading...</li>
    <li id="basePercent">Burn: Loading...</li>
    <li id="totalSupply2">Supply: Loading...</li>
    <li id="marketCap2">Market Cap: Loading...</li>
    <li id="countdown2">Next Bloom: Loading...</li>
    <li id="walletAddress">Wallet: Connecting...</li>
  </ul>
</section>

<!-- Footer -->
<footer>
  Click/Tap anywhere when it's time to bloom to call the bloom function
</footer>

<!-- Script -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
  const bloomTokenAddress = "0x4A67A65c2fdB0397fa41eFC3896b0eCD4c2d006E";
  const lpAddress = "0x8cccbb96e0f8d491c611dd2Ab5f45753728A167a";
  const bloomAbi = [
    "function totalSupply() view returns (uint256)",
    "function basePercent() view returns (uint256)",
    "function getNextRebaseTime() view returns (uint256)"
  ];
  const lpAbi = [
    "function getReserves() view returns (uint112 reserve0, uint112 reserve1, uint32 blockTimestampLast)",
    "function token0() view returns (address)",
    "function token1() view returns (address)"
  ];
  const provider = new ethers.providers.JsonRpcProvider("https://rpc.ankr.com/base/d41098a1457bd77208ea6662406dcdafc4567718858a40ae83788b601c854349");

  async function fetchBloomStats() {
    try {
      const bloom = new ethers.Contract(bloomTokenAddress, bloomAbi, provider);
      const lp = new ethers.Contract(lpAddress, lpAbi, provider);

      const [supplyRaw, basePercent, nextRebaseTime, reserves, token0, token1] = await Promise.all([
        bloom.totalSupply(),
        bloom.basePercent(),
        bloom.getNextRebaseTime(),
        lp.getReserves(),
        lp.token0(),
        lp.token1()
      ]);

      const decimals = 6;
      const supply = parseFloat(ethers.utils.formatUnits(supplyRaw, decimals));
      const [reserve0, reserve1] = reserves;
      const bloomIsToken0 = token0.toLowerCase() === bloomTokenAddress.toLowerCase();
      const bloomReserve = bloomIsToken0 ? reserve0 : reserve1;
      const usdcReserve = bloomIsToken0 ? reserve1 : reserve0;
      const price = (usdcReserve / 10 ** 6) / (bloomReserve / 10 ** 6);
      const marketCap = supply * price;

      document.getElementById("price").textContent = `Price: $${price.toFixed(6)}`;
      document.getElementById("totalSupply2").textContent = `Supply: ${supply.toFixed(6)} BLOOM`;
      document.getElementById("marketCap2").textContent = `Market Cap: $${marketCap.toFixed(2)}`;
      document.getElementById("upcomingRebasePercentage").textContent = `Bloom Rate: +${(basePercent / 100).toFixed(2)}%`;
      document.getElementById("basePercent").textContent = `Burn: ${(basePercent / 100).toFixed(2)}%`;

      startCountdown(nextRebaseTime.toNumber());
    } catch (err) {
      console.error("Error fetching Bloom stats:", err);
    }
  }

  function startCountdown(nextRebaseTimestamp) {
    const countdownEl = document.getElementById("countdown2");

    function updateCountdown() {
      const now = Math.floor(Date.now() / 1000);
      const seconds = nextRebaseTimestamp - now;
      if (seconds <= 0) {
        countdownEl.textContent = "Rebasing...";
        fetchBloomStats(); // refresh stats after rebase
        return;
      }
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      countdownEl.textContent = `Next Bloom: ${h}h ${m}m ${s}s.`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  }

  async function connectWallet() {
    const walletEl = document.getElementById("walletAddress");
    if (window.ethereum) {
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        walletEl.textContent = `Wallet: ${accounts[0]}`;
      } catch {
        walletEl.textContent = "Wallet: Connection rejected";
      }
    } else {
      walletEl.textContent = "Wallet: MetaMask not detected";
    }
  }

  window.addEventListener("load", () => {
    connectWallet();
    fetchBloomStats();
  });
</script>


<!-- Your original flower-generating script -->
<script src="./script.js"></script>

</body>
</html>
