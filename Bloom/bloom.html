<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bloom Token Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #111;
            color: #0f0;
        }
        h1 {
            color: #fff;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 8px;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            background-color: #0f0;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0c0;
        }
    </style>
</head>
<body>
    <h1>BLOOM TOKEN</h1>
    <ul>
        <li id="walletAddress">Wallet: Not Connected</li>
        <li id="tokenPrice"></li>
        <li id="totalSupply2"></li>
        <li id="marketCap2"></li>
        <li id="upcomingRebasePercentage"></li>
        <li id="basePercent"></li>
        <li id="countdown2"></li>
    </ul>
    <button id="connectButton">Connect Wallet</button>

    <script>
        const bloomTokenAddress = "0x4A67A65c2fdB0397fa41eFC3896b0eCD4c2d006E";
        const bloomAbi = [
            "function totalSupply() view returns (uint256)",
            "function basePercent() view returns (uint256)",
            "function getLastRebaseTimestamp() view returns (uint256)",
            "function getNextRebaseTime() view returns (uint256)"
        ];
        const lpAddress = "0x8cccbb96e0f8d491c611dd2Ab5f45753728A167a";
        const usdcDecimals = 6;
        const bloomDecimals = 6;

        const provider = new ethers.providers.JsonRpcProvider("https://rpc.ankr.com/base/d41098a1457bd77208ea6662406dcdafc4567718858a40ae83788b601c854349");

        async function fetchBloomStats() {
            const bloomContract = new ethers.Contract(bloomTokenAddress, bloomAbi, provider);

            const [totalSupply, basePercent, lastRebase, nextRebase] = await Promise.all([
                bloomContract.totalSupply(),
                bloomContract.basePercent(),
                bloomContract.getLastRebaseTimestamp(),
                bloomContract.getNextRebaseTime()
            ]);

            document.getElementById("totalSupply2").textContent = `Total Supply: ${ethers.utils.formatUnits(totalSupply, bloomDecimals)}`;
            document.getElementById("basePercent").textContent = `Burn/Rebase Base %: ${basePercent / 100}%`;

            // Countdown
            const now = Math.floor(Date.now() / 1000);
            const secondsUntilRebase = nextRebase.toNumber() - now;
            const hours = Math.floor(secondsUntilRebase / 3600);
            const minutes = Math.floor((secondsUntilRebase % 3600) / 60);
            const seconds = secondsUntilRebase % 60;

            document.getElementById("countdown2").textContent = `Next Rebase In: ${hours}h ${minutes}m ${seconds}s`;

            // Price estimation
            const lpAbi = [
                "function getReserves() view returns (uint112 reserve0, uint112 reserve1, uint32 blockTimestampLast)",
                "function token0() view returns (address)",
                "function token1() view returns (address)"
            ];
            const lpContract = new ethers.Contract(lpAddress, lpAbi, provider);

            const [reserve0, reserve1] = await lpContract.getReserves();
            const token0 = await lpContract.token0();
            const token1 = await lpContract.token1();

            let bloomReserve, usdcReserve;
            if (token0.toLowerCase() === bloomTokenAddress.toLowerCase()) {
                bloomReserve = reserve0;
                usdcReserve = reserve1;
            } else {
                bloomReserve = reserve1;
                usdcReserve = reserve0;
            }

            const price = (usdcReserve / 10 ** usdcDecimals) / (bloomReserve / 10 ** bloomDecimals);
            const supply = totalSupply / 10 ** bloomDecimals;
            const marketCap = price * supply;

            document.getElementById("tokenPrice").textContent = `Price: $${price.toFixed(6)}`;
            document.getElementById("marketCap2").textContent = `Market Cap: $${marketCap.toFixed(2)}`;
            document.getElementById("upcomingRebasePercentage").textContent = `Upcoming Rebase %: +${basePercent / 100}%`;
        }

        document.getElementById("connectButton").addEventListener("click", async () => {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    document.getElementById("walletAddress").textContent = `Wallet: ${accounts[0]}`;
                } catch (err) {
                    console.error("User rejected request", err);
                }
            } else {
                alert("MetaMask not detected!");
            }
        });

        fetchBloomStats();
        setInterval(fetchBloomStats, 30000); // refresh every 30s
    </script>



<!-- Your original flower-generating script -->
<script src="./script.js"></script>

</body>
</html>
