<script>
    document.addEventListener('DOMContentLoaded', async function() {
        try {
            // Define contract address and ABI
            const contractAddress = '0xF832cA45a6316F0a4447b861f36De8FFa2B06D82';
            const contractABI = [
                {
                    "anonymous": false,
                    "inputs": [
                        {
                            "indexed": true,
                            "name": "epoch",
                            "type": "uint256"
                        },
                        {
                            "indexed": false,
                            "name": "totalSupply",
                            "type": "uint256"
                        }
                    ],
                    "name": "LogRebase",
                    "type": "event"
                }
            ];

            // Initialize Web3
            if (window.ethereum) {
                window.web3 = new Web3(window.ethereum);
                try {
                    // Request account access if needed
                    await window.ethereum.enable();
                    console.log('Metamask connected!');
                } catch (error) {
                    // User denied account access
                    console.error('User denied account access');
                    return; // Stop execution if user denies access
                }
            } else if (window.web3) {
                window.web3 = new Web3(window.web3.currentProvider);
            } else {
                console.error('Non-Ethereum browser detected. You should consider installing Metamask.');
                return; // Stop execution if non-Ethereum browser detected
            }

            // Get the contract instance
            const contractInstance = new web3.eth.Contract(contractABI, contractAddress);

            // Get the latest successful rebase event
            contractInstance.getPastEvents('LogRebase', {
                fromBlock: 0,
                toBlock: 'latest'
            }).then(async events => {
                const latestEvent = events[events.length - 1];
                const blockNumber = latestEvent.blockNumber;
                const block = await web3.eth.getBlock(blockNumber);
                const timestamp = block.timestamp;

                // Calculate the timestamp for the next rebase (24 hours after the last rebase)
                const nextRebaseTimestamp = timestamp + (24 * 60 * 60);
                console.log('Next Rebase Timestamp:', new Date(nextRebaseTimestamp * 1000));

                // Start a countdown to the next rebase timestamp
                startCountdown(nextRebaseTimestamp);
            }).catch(error => {
                console.error('Error fetching LogRebase events:', error);
            });
        } catch (error) {
            console.error('Error:', error);
            // Handle errors here
        }
    });

    function startCountdown(nextRebaseTimestamp) {
    // Get the countdown element
    const countdownElement = document.getElementById('countdown');
    const countdownElement2 = document.getElementById('countdown2');

    // Update the countdown every second
    const countdownInterval = setInterval(() => {
        // Get the current time
        const currentTime = Math.floor(Date.now() / 1000);

        // Calculate the remaining time in seconds
        const remainingTime = nextRebaseTimestamp - currentTime;

        // Check if the countdown has reached zero
        if (remainingTime <= 0) {
            // If countdown has ended, clear the interval and update the UI
            clearInterval(countdownInterval);
            countdownElement.textContent = 'Rebase is now!';
            countdownElement2.textContent = 'Rebase is now!';
        } else {
            // Convert remaining time to hours, minutes, and seconds
            const hours = Math.floor(remainingTime / 3600);
            const minutes = Math.floor((remainingTime % 3600) / 60);
            const seconds = remainingTime % 60;

            // Format the remaining time and update the UI
            countdownElement.textContent = `Next Rebase: ${hours}h ${minutes}m ${seconds}s`;
            countdownElement2.textContent = `Next Rebase: ${hours}h ${minutes}m ${seconds}s`;
        }
    }, 1000); // Update every second
}

</script>
