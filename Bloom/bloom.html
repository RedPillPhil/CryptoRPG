<!DOCTYPE html>
<html>
<head>
  <title>Bloom Token Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>
  <h1>🌸 Bloom Token Dashboard</h1>
  <button onclick="connectWallet()">Connect Wallet</button>
  <button onclick="triggerRebase()">Trigger Rebase</button>

  <div id="stats">
    <p>Total Supply: <span id="totalSupply"></span></p>
    <p>Price: $<span id="price"></span></p>
    <p>Market Cap: $<span id="marketCap"></span></p>
    <p>Burn Rate: <span id="burnRate"></span>%</p>
    <p>Countdown to Next Rebase: <span id="countdown"></span></p>
  </div>

  <script>
    const bloomTokenAddress = '0x4A67A65c2fdB0397fa41eFC3896b0eCD4c2d006E';
    const lpPairAddress = '0x8cccbb96e0f8d491c611dd2Ab5f45753728A167a';
    const usdcDecimals = 6;
    const bloomDecimals = 6;

    const rpc = "https://rpc.ankr.com/base/d41098a1457bd77208ea6662406dcdafc4567718858a40ae83788b601c854349";
    const web3 = new Web3(new Web3.providers.HttpProvider(rpc));

    const bloomAbi = [/* Paste your full ABI here */];

    const bloom = new web3.eth.Contract(bloomAbi, bloomTokenAddress);
    const lp = new web3.eth.Contract([
      {
        "constant": true,
        "inputs": [],
        "name": "getReserves",
        "outputs": [
          { "name": "_reserve0", "type": "uint112" },
          { "name": "_reserve1", "type": "uint112" },
          { "name": "_blockTimestampLast", "type": "uint32" }
        ],
        "type": "function"
      },
      {
        "constant": true,
        "inputs": [],
        "name": "token0",
        "outputs": [{ "name": "", "type": "address" }],
        "type": "function"
      },
      {
        "constant": true,
        "inputs": [],
        "name": "token1",
        "outputs": [{ "name": "", "type": "address" }],
        "type": "function"
      }
    ], lpPairAddress);

    async function fetchStats() {
      const supply = await bloom.methods.totalSupply().call();
      const decimals = await bloom.methods.decimals().call();
      const basePercent = await bloom.methods.basePercent().call();
      const creationTime = await bloom.methods.contractCreationTime().call();

      // Get reserves
      const token0 = await lp.methods.token0().call();
      const reserves = await lp.methods.getReserves().call();
      const reserveBloom = token0.toLowerCase() === bloomTokenAddress.toLowerCase() ? reserves._reserve0 : reserves._reserve1;
      const reserveUSDC = token0.toLowerCase() === bloomTokenAddress.toLowerCase() ? reserves._reserve1 : reserves._reserve0;

      const price = reserveUSDC / reserveBloom;
      const totalSupplyFormatted = supply / (10 ** decimals);
      const marketCap = totalSupplyFormatted * price;
      const burnRate = basePercent / 100;

      // Countdown logic (1 hour rebases)
      const now = Math.floor(Date.now() / 1000);
      const secondsSinceStart = now - creationTime;
      const secondsToNextRebase = 3600 - (secondsSinceStart % 3600);
      const countdown = new Date(secondsToNextRebase * 1000).toISOString().substr(11, 8);

      // Update DOM
      document.getElementById('totalSupply').innerText = totalSupplyFormatted.toFixed(2);
      document.getElementById('price').innerText = price.toFixed(6);
      document.getElementById('marketCap').innerText = marketCap.toFixed(2);
      document.getElementById('burnRate').innerText = burnRate.toFixed(2);
      document.getElementById('countdown').innerText = countdown;
    }

    async function connectWallet() {
      if (window.ethereum) {
        window.web3 = new Web3(window.ethereum);
        await ethereum.request({ method: 'eth_requestAccounts' });
        alert('Wallet connected');
      } else {
        alert('MetaMask not detected');
      }
    }

    async function triggerRebase() {
      const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
      const account = accounts[0];
      const web3Injected = new Web3(window.ethereum);
      const bloomWrite = new web3Injected.eth.Contract(bloomAbi, bloomTokenAddress);

      try {
        await bloomWrite.methods.Bloom().send({ from: account });
        alert('Rebase triggered!');
        fetchStats(); // Refresh stats
      } catch (err) {
        alert('Rebase failed: ' + err.message);
      }
    }

    fetchStats();
    setInterval(fetchStats, 15000); // Refresh every 15 seconds
  </script>
</body>
</html>
