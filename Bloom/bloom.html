  <script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>

<body>
  <section>
    <ul id="bloom-stats">
      <li id="price">Price: Loading...</li>
      <li id="bloomRate">Bloom Rate: Loading...</li>
      <li id="burnRate">Burn Rate: Loading...</li>
      <li id="totalSupply">Total Supply: Loading...</li>
      <li id="marketCap">Market Cap: Loading...</li>
      <li id="countdown">Time Until Next Bloom: Loading...</li>
    </ul>
  </section>

  <script>
    const provider = new ethers.providers.JsonRpcProvider("https://rpc.ankr.com/base/d41098a1457bd77208ea6662406dcdafc4567718858a40ae83788b601c854349");
    const tokenAddress = "0x4A67A65c2fdB0397fa41eFC3896b0eCD4c2d006E";
    const usdcAddress = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913";
    const pairAddress = "0x8cccbb96e0f8d491c611dd2Ab5f45753728A167a";
    const tokenDecimals = 6;

    const abi = [
      "function totalSupply() view returns (uint256)",
      "function basePercent() view returns (uint256)",
      "function upcomingRebasePercentage() view returns (uint256)",
      "event LogRebase(uint256 epoch, uint256 totalSupply)"
    ];
    const erc20ABI = [
      "function balanceOf(address) view returns (uint256)"
    ];

    const token = new ethers.Contract(tokenAddress, abi, provider);
    const tokenContract = new ethers.Contract(tokenAddress, erc20ABI, provider);
    const usdcContract = new ethers.Contract(usdcAddress, erc20ABI, provider);

    async function getLastRebaseTime() {
      const currentBlock = await provider.getBlockNumber();
      const events = await token.queryFilter("LogRebase", currentBlock - 100000, currentBlock);
      const latest = events.pop();
      if (!latest) return null;
      const block = await provider.getBlock(latest.blockNumber);
      return block.timestamp + 86400;
    }

    function formatCountdown(targetTime) {
      const now = Math.floor(Date.now() / 1000);
      const remaining = targetTime - now;
      if (remaining <= 0) return '🌸 Rebase happening now!';
      const h = Math.floor(remaining / 3600);
      const m = Math.floor((remaining % 3600) / 60);
      const s = remaining % 60;
      return `${h} hours, ${m} minutes, ${s} seconds`;
    }

    async function loadStats() {
      const [supply, burnRaw, bloomRate, tokenBal, usdcBal, nextRebase] = await Promise.all([
        token.totalSupply(),
        token.basePercent(),
        token.upcomingRebasePercentage(),
        tokenContract.balanceOf(pairAddress),
        usdcContract.balanceOf(pairAddress),
        getLastRebaseTime()
      ]);

      const price = parseFloat(ethers.utils.formatUnits(usdcBal, tokenDecimals)) / parseFloat(ethers.utils.formatUnits(tokenBal, tokenDecimals));
      const formattedSupply = parseFloat(ethers.utils.formatUnits(supply, tokenDecimals)).toLocaleString();
      const marketCap = (parseFloat(ethers.utils.formatUnits(supply, tokenDecimals)) * price).toFixed(2);
      const burnRate = (100 / burnRaw).toFixed(2);
      const bloomRateFormatted = parseFloat(bloomRate).toFixed(2);

      document.getElementById("price").innerText = `💵 Price: $${price.toFixed(6)}`;
      document.getElementById("bloomRate").innerText = `📈 Bloom Rate: ${bloomRateFormatted}%`;
      document.getElementById("burnRate").innerText = `🔥 Burn Rate: ${burnRate}%`;
      document.getElementById("totalSupply").innerText = `🪙 Total Supply: ${formattedSupply} BLOOM`;
      document.getElementById("marketCap").innerText = `📊 Market Cap: $${marketCap}`;
      document.getElementById("countdown").innerText = `⏳ Time Until Next Bloom: ${formatCountdown(nextRebase)}`;
    }

    loadStats();
    setInterval(loadStats, 60000); // refresh every 60s
  </script>
</body>

<!-- Script -->
<script>
  const bloomAddress = "0x4A67A65c2fdB0397fa41eFC3896b0eCD4c2d006E";
  const baseRpc = "https://mainnet.base.org";
  const web3 = new Web3(baseRpc);

  const bloomAbi = [
    { constant: true, inputs: [], name: "totalSupply", outputs: [{ name: "", type: "uint256" }], type: "function" },
    { constant: true, inputs: [], name: "getPrice", outputs: [{ name: "", type: "uint256" }], type: "function" },
    { constant: true, inputs: [], name: "rebasePercent", outputs: [{ name: "", type: "uint256" }], type: "function" },
    { constant: true, inputs: [], name: "burnPercent", outputs: [{ name: "", type: "uint256" }], type: "function" },
    { constant: true, inputs: [], name: "nextRebaseTime", outputs: [{ name: "", type: "uint256" }], type: "function" }
  ];

  const bloom = new web3.eth.Contract(bloomAbi, bloomAddress);

  async function fetchBloomStats() {
    try {
      const [price, supply, rebase, burn, nextRebase] = await Promise.all([
        bloom.methods.getPrice().call(),
        bloom.methods.totalSupply().call(),
        bloom.methods.rebasePercent().call(),
        bloom.methods.burnPercent().call(),
        bloom.methods.nextRebaseTime().call()
      ]);

      const decimals = 18;
      const readablePrice = (price / (10 ** decimals)).toFixed(6);
      const readableSupply = (supply / (10 ** decimals)).toLocaleString();
      const marketCap = (price * supply / (10 ** (2 * decimals))).toFixed(2);

      document.getElementById("price").textContent = `Price: $${readablePrice}`;
      document.getElementById("totalSupply2").textContent = `Supply: ${readableSupply}`;
      document.getElementById("marketCap2").textContent = `Market Cap: $${marketCap}`;
      document.getElementById("upcomingRebasePercentage").textContent = `Rebase: ${rebase / 100}%`;
      document.getElementById("basePercent").textContent = `Burn: ${burn / 100}%`;

      updateCountdown(nextRebase);
    } catch (error) {
      console.error("Failed to fetch data:", error);
    }
  }

  function updateCountdown(nextRebaseTime) {
    const countdownEl = document.getElementById("countdown2");
    const interval = setInterval(() => {
      const now = Math.floor(Date.now() / 1000);
      const seconds = nextRebaseTime - now;
      if (seconds <= 0) {
        countdownEl.textContent = "Rebasing...";
        clearInterval(interval);
        fetchBloomStats(); // refresh after rebase
      } else {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        countdownEl.textContent = `Next Bloom: ${h}h ${m}m ${s}s`;
      }
    }, 1000);
  }

  async function autoConnectWallet() {
    const walletEl = document.getElementById("walletAddress");
    if (typeof window.ethereum !== "undefined") {
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        walletEl.textContent = `Wallet: ${accounts[0]}`;
      } catch (err) {
        walletEl.textContent = "Wallet: Connection rejected";
        console.warn("Wallet connection rejected.");
      }
    } else {
      walletEl.textContent = "Wallet: MetaMask not detected";
      alert("MetaMask not detected. Please install MetaMask to use this site.");
    }
  }

  window.addEventListener("load", async () => {
    await autoConnectWallet();
    fetchBloomStats();
  });
</script>
