<script>
  // Disable the button by default
  document.getElementById('rebaseButton').disabled = true;

  // Function to update the countdown and handle enabling the button
  function updateCountdown() {
    const countdownElement = document.getElementById('countdown');
    const countdownValue = parseInt(countdownElement.textContent); // Assuming the countdown is a number

    // If countdown reaches 0, enable the button
    if (countdownValue <= 0) {
      document.getElementById('rebaseButton').disabled = false;
    }
  }

  // Update countdown every second (example, adjust as needed)
  setInterval(() => {
    // Update countdown display, make sure it's in a number format
    const countdownElement = document.getElementById('countdown');
    let countdownValue = parseInt(countdownElement.textContent);

    if (countdownValue > 0) {
      countdownValue--;
      countdownElement.textContent = countdownValue;
    }
    
    // Enable button when countdown reaches 0
    updateCountdown();
  }, 1000);

  // Make the Rebase Button functional
  document.getElementById('rebaseButton').addEventListener('click', (e) => {
    e.stopPropagation(); // Prevent any unwanted interaction
    console.log("Rebase button clicked!");
    triggerRebase(); // Call your rebase function here
  });
</script>

  async function getLastRebaseTime() {
    try {
      const latestBlock = await web3.eth.getBlockNumber();
      let fromBlock = latestBlock - 99999;
      let found = false;
      let latestEvent = null;

      while (!found && fromBlock >= 0) {
        const events = await bloom.getPastEvents('LogRebase', {
          fromBlock: fromBlock,
          toBlock: latestBlock
        });

        if (events.length > 0) {
          latestEvent = events[events.length - 1];
          found = true;
        } else {
          latestBlock = fromBlock - 1;
          fromBlock = latestBlock - 99999;
          if (fromBlock < 0) fromBlock = 0;
        }
      }

      if (!latestEvent) {
        console.log('❌ No LogRebase events found.');
        return null;
      }

      const block = await web3.eth.getBlock(latestEvent.blockNumber);
      const lastRebaseTimestamp = block.timestamp;
      const nextRebaseTimestamp = lastRebaseTimestamp + 86400; // 24 hours
      return nextRebaseTimestamp;
    } catch (error) {
      console.error("Failed to get last rebase time:", error);
      return null;
    }
  }

  async function updateRebaseCountdown() {
    const nextRebaseTimestamp = await getLastRebaseTime();
    if (!nextRebaseTimestamp) {
      document.getElementById('countdown').innerText = "Error";
      return;
    }

    const now = Math.floor(Date.now() / 1000);
    const secondsRemaining = nextRebaseTimestamp - now;
    const countdown =
      secondsRemaining > 0
        ? new Date(secondsRemaining * 1000).toISOString().substr(11, 8)
        : "00:00:00";

    document.getElementById('countdown').innerText = countdown;
  }

  async function fetchStats() {
    try {
      const supply = await bloom.methods.totalSupply().call();
      const decimals = await bloom.methods.decimals().call();
      const basePercent = await bloom.methods.basePercent().call();

      const token0 = await lp.methods.token0().call();
      const reserves = await lp.methods.getReserves().call();
      const reserveBloom = token0.toLowerCase() === bloomTokenAddress.toLowerCase()
        ? reserves._reserve0
        : reserves._reserve1;
      const reserveUSDC = token0.toLowerCase() === bloomTokenAddress.toLowerCase()
        ? reserves._reserve1
        : reserves._reserve0;

      const price = reserveUSDC / reserveBloom;
      const totalSupplyFormatted = supply / (10 ** decimals);
      const marketCap = totalSupplyFormatted * price;
      const burnRate = 100 / basePercent;

      document.getElementById('totalSupply').innerText = totalSupplyFormatted.toFixed(2);
      document.getElementById('price').innerText = price.toFixed(2);
      document.getElementById('marketCap').innerText = marketCap.toFixed(2);
      document.getElementById('burnRate').innerText = burnRate.toFixed(2);

      fetchUpcomingRebasePercentage();
      updateRebaseCountdown();
    } catch (error) {
      console.error("Error fetching stats:", error);
    }
  }

  async function fetchUpcomingRebasePercentage() {
    try {
      const rate = await bloom.methods.upcomingRebasePercentage().call();
      document.getElementById("upcomingRebasePercentage").innerText = `${rate}%`;
    } catch (err) {
      console.error("Failed to fetch rebase %:", err);
      document.getElementById("upcomingRebasePercentage").innerText = "Error";
    }
  }

  async function connectWallet() {
    if (window.ethereum) {
      try {
        window.web3 = new Web3(window.ethereum);
        const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
        const wallet = accounts[0];
        document.getElementById('walletAddress').innerText = `Wallet: ${wallet}`;
      } catch (err) {
        console.error("Wallet connection error:", err);
        document.getElementById('walletAddress').innerText = "Wallet: Error";
      }
    } else {
      alert("MetaMask not detected");
      document.getElementById('walletAddress').innerText = "Wallet: Not Detected";
    }
  }


    async function triggerRebase() {
      const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
      const account = accounts[0];
      const web3Injected = new Web3(window.ethereum);
      const bloomWrite = new web3Injected.eth.Contract(bloomAbi, bloomTokenAddress);

      try {
        await bloomWrite.methods.Bloom().send({ from: account });
        alert('Rebase triggered!');
